[package]
name = "kotton-cli"
version = "0.1.0"
edition = "2021"
# The binaries are the two `[[bin]]`s below and no other: a stray `src/main.rs` is not built.
autobins = false
license.workspace = true

[lib]
name = "kotton_cli"
path = "src/lib.rs"

[[bin]]
name = "kotton"
path = "src/kotton.rs"

[[bin]]
name = "kctl"
path = "src/kctl.rs"

[dependencies]
kotton = { path = "../kotton-client" }
kotton-operator = { path = "../kotton-operator" }
kotton-shell = { path = "../shell" }
kotton-schemas = { path = "../../core/schemas" }
kotton-record-file = { path = "../record-file" }
kotton-crypto = { path = "../../core/crypto" }
kotton-sys = { path = "../../core/sys" }
kotton-common = { path = "../../core/common" }
kotton-version = { path = "../../core/version" }
kotton-secret = { path = "../../core/secret" }
# `device reset` reads the recovery-bundle count and purges the keychain labels;
# both rules live here and must not be copied. No sqlx: this crate is the thin
# client and does not take the daemon's storage reach for a listing.
kotton-identity = { path = "../../core/identity" }
kotton-wire = { path = "../../core/wire" }
kotton-ipc = { path = "../../core/ipc" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.41", features = ["full"] }
serde_json = "1.0"
rpassword = "7"
ed25519-dalek = { workspace = true }
base64 = "0.22"
hex = "0.4"
rand = "0.8"
tracing-subscriber = { workspace = true }

[lints]
workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = { workspace = true }

[dev-dependencies]
workspace-hack = { path = "../../tools/workspace-hack" }
