[package]
name = "kotton-shell"
version = "0.1.0"
edition = "2021"
license.workspace = true

[features]
default = ["cli"]
# CLI-only surface (RFC-0028): the IPC client, terminal line-editor/TUI, ANSI colours,
# and the system + host-import/export commands that depend on them. The guest-side
# (WASM) build disables this feature and runs the engine confined to the `ShellHost`
# port with only the data commands.
cli = [
    "dep:kotton",
    "dep:rustyline",
    "dep:crossterm",
    "dep:colored",
    "dep:rpassword",
    "dep:tokio",
    "dep:kotton-sys",
    # The credential prompt draws a suggestion and judges what is typed. Behind
    # `cli` and not unconditional: `kotton-crypto` pulls `kotton-sys`, which
    # pulls `tokio` with `full`, which does not build for wasm32 — and the guest
    # shell depends on this crate with `default-features = false`. Added
    # unqualified on 2026-08-29 and the wasm build refused within the minute,
    # which is the seam working.
    "dep:kotton-crypto",
]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = "0.4"
colored = { version = "2.1", optional = true }
crossterm = { version = "0.27", optional = true }
rpassword = { version = "7.3", optional = true }
rustyline = { version = "14.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"], optional = true }

# Internal dependencies
kotton-common = { path = "../../core/common" }
kotton-sys = { path = "../../core/sys", optional = true }
kotton-schemas = { path = "../../core/schemas" }
kotton-wire = { path = "../../core/wire" }
kotton-crypto = { path = "../../core/crypto", optional = true }
kotton = { path = "../kotton-client", optional = true }

[dev-dependencies]
workspace-hack = { path = "../../tools/workspace-hack" }
tempfile = "3.8"
# kotton-storage = { path = "../storage" }  # DELETED - was unused

[lints]
workspace = true
