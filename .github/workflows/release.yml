# Publishes the desktop, the relay, the vault and the host (the relay and the vault in one
# archive) as a GitHub Release, on a pushed tag and on nothing else.
#
# What it does: builds `cargo xtask release-server relay`, `vault` and `host`, then `cargo xtask
# release` for the Linux desktop, on one Linux runner — each install-tested before it is named,
# exactly as on the owner's PC — writes SHA256SUMS over the four archives, and attaches all five
# files to the release for the tag. It signs nothing. The owner
# signs SHA256SUMS on their own machine and attaches SHA256SUMS.sig by hand
# (docs/use/build-a-release.md): a key GitHub holds would prove only that GitHub's runner built
# what the repository said, which is true of every fork.
#
# What it must never become: a build on every push. A `push:` trigger on every merge, nine jobs
# and a macOS runner billed at ten Linux minutes once spent a month's minutes on hundreds of
# failed runs. `cargo xtask actions-check`, in `just lint`, admits a workflow here only if it
# runs on a pushed tag (at most an empty `workflow_dispatch` beside it) — or is `lint.yml`, which
# runs `just lint` on a pull request and nothing else — every job on a plain `ubuntu-…` runner,
# with no reusable-workflow job, so none of that comes back by accident.
#
# Two jobs, and only the second can write. `build` runs the repository's code and every
# dependency's build script — some seven hundred crates — holding a read-only token that is not
# even left on disk. `publish` runs no repository code at all: it downloads the five files and
# calls `gh`. On a hosted runner every step has passwordless sudo, so a token scoped to one step
# is still in reach of the others; only a job boundary keeps the write token away from a build
# script. The second job costs about a billed minute.
#
# Every `uses:` is pinned to a full commit SHA with its version in a trailing comment, on
# purpose. Do not
# "update" them back to tags: a moved tag runs someone else's code with this job's token.
# Resolved 2026-09-29:
#   git ls-remote --tags https://github.com/actions/checkout          | grep 11d5960a  -> v4, v4.4.0
#   git ls-remote --tags https://github.com/actions/upload-artifact   | grep ea165f8d  -> v4, v4.6.2
#   git ls-remote --tags https://github.com/actions/download-artifact | grep d3f86a10  -> v4, v4.3.0
#
# The toolchain is the one version rust-toolchain.toml names, which the runner's rustup reads
# and installs, so a release is built by the same compiler on the runner as on the PC.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A ceiling against a hung step, not an estimate: the servers take about a quarter of an
    # hour on 4 vCPU, and the desktop's build, nine binaries each optimised whole at link time,
    # is the longest of the three and not yet timed on a runner.
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      # `release-server` runs `git fetch origin main`. With no credential left on disk that
      # fetch cannot authenticate, and must fail at once rather than wait on a prompt; the
      # origin/main it then compares HEAD against is the one checkout fetched below.
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Every branch, so refs/remotes/origin/main exists: a release is built from main as
          # origin has it, and `release-server` refuses a tag that does not name main's tip.
          fetch-depth: 0
          persist-credentials: false

      # What `cargo xtask doctor --tier server` names, installed; then doctor itself, which
      # exits non-zero on anything still missing.
      - name: Install the server tier
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools build-essential perl
          rustup toolchain install --profile minimal
          rustup target add x86_64-unknown-linux-musl
          cargo xtask doctor --tier server

      # What `cargo xtask doctor --tier build` names, installed; then doctor itself, which exits
      # non-zero on anything still missing. That tier is what `cargo xtask release` builds with:
      # the wasm target and clang build the bundled apps, python3 runs stylo's build script, kuid
      # links fontconfig, GTK, pango and libxdo, and the host build links the system's OpenSSL
      # for sqlcipher (OPENSSL_NO_VENDOR, .cargo/config.toml); pkg-config finds the libraries
      # that ship a .pc file, and libxdo is linked by name.
      #
      # Not `doctor --tier desktop`. That tier is the build's rows and then what the window needs
      # to run, a window manager on a display and a GPU, and a runner has neither, so it would
      # refuse every tag for things the build never reads.
      - name: Install the build tier
        run: |
          sudo apt-get install -y pkg-config build-essential libfontconfig-dev libssl-dev clang python3 libgtk-3-dev libpango1.0-dev libxdo-dev
          rustup target add wasm32-wasip2
          cargo xtask doctor --tier build

      # The relay first: the vault's install test starts it against the relay archive.
      - name: Build and install-test the relay
        run: cargo xtask release-server relay

      - name: Build and install-test the vault
        run: cargo xtask release-server vault

      # The two just built, packed together for one machine; cargo finds both up to date.
      - name: Build and install-test the host
        run: cargo xtask release-server host

      # The GPU renderer, as the archive ships, built on a runner with no GPU: compiling it
      # needs none, and the install test opens no window. It runs the installed `kotton-start`
      # with only HOME and PATH set, so the daemon sees no DISPLAY and starts no kuid; it makes
      # an identity at a terminal and checks the daemon staged the shell the archive carries. As
      # the runner's user it cannot make a network namespace, so it says it is not offline: that
      # the archive reaches no network is shown where the test runs as root, not here.
      - name: Build and install-test the desktop
        run: cargo xtask release

      - name: Write SHA256SUMS
        run: |
          rev="$(git rev-parse HEAD | cut -c1-12)"
          cd out/dist
          relay="kotton-relay-${rev}-linux-x86_64.tar.gz"
          vault="kotton-vault-${rev}-linux-x86_64.tar.gz"
          host="kotton-host-${rev}-linux-x86_64.tar.gz"
          desktop="kotton-${rev}-linux-x86_64.tar.gz"
          test -f "$relay" && test -f "$vault" && test -f "$host" && test -f "$desktop"
          sha256sum "$relay" "$vault" "$host" "$desktop" > SHA256SUMS
          cat SHA256SUMS

      # Four patterns that cannot overlap. The desktop's name has the commit straight after
      # `kotton-`, and a commit is hexadecimal, so `kotton-[0-9a-f]*` matches none of
      # `kotton-relay-`, `kotton-vault-` and `kotton-host-`; a bare `kotton-*` would match all four.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            out/dist/kotton-relay-*-linux-x86_64.tar.gz
            out/dist/kotton-vault-*-linux-x86_64.tar.gz
            out/dist/kotton-host-*-linux-x86_64.tar.gz
            out/dist/kotton-[0-9a-f]*-linux-x86_64.tar.gz
            out/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The one widening in this file: attaching assets to a release is a contents write.
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release

      # Attaches to the tag's release, creating it if the owner has not drafted one. Never
      # --clobber: a name already on the release stays as it is, since SHA256SUMS.sig may
      # already vouch for it.
      - name: Attach the four archives and SHA256SUMS to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd release
          ls -l
          sha256sum -c SHA256SUMS
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" kotton-[0-9a-f]*-linux-x86_64.tar.gz kotton-relay-*.tar.gz kotton-vault-*.tar.gz kotton-host-*.tar.gz SHA256SUMS
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
              --notes "The Linux desktop, the relay, the vault, and the host (the relay and the vault together), built by cargo xtask release and cargo xtask release-server from $GITHUB_SHA. Verify before installing: docs/use/first-hour.md for the desktop, docs/use/run-a-host.md for a host. SHA256SUMS.sig is attached by the owner, signed off GitHub; until it is, the sums prove only that the bytes arrived whole." \
              kotton-[0-9a-f]*-linux-x86_64.tar.gz kotton-relay-*.tar.gz kotton-vault-*.tar.gz kotton-host-*.tar.gz SHA256SUMS
          fi
