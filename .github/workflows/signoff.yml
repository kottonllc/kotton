# Every commit a pull request brings is signed off by the person it is authored as, is not
# authored or committed as an agent, and carries no agent as a co-author. CONTRIBUTING.md,
# "Every commit is signed off". Runs on every pull request and on nothing else.
name: signoff
on:
  pull_request:
jobs:
  signoff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: every commit is signed off by its author, and no agent made one
        run: |
          set -eu
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          bad=0
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          trim() { printf '%s' "$1" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'; }
          # An identity is an agent's when its address is the Anthropic no-reply address, its
          # name is fable-design, or either names a forge bot ([bot]). Compared ignoring case.
          is_agent() {
            case "$(lower "$1")" in fable-design|*"[bot]") return 0 ;; esac
            case "$(lower "$2")" in noreply@anthropic.com|*"[bot]@users.noreply.github.com") return 0 ;; esac
            return 1
          }
          # Trailers are read with git's own parser, so a line in the body is not one.
          trailer_values() { git log -1 --format="%(trailers:key=$2,valueonly,unfold)" "$1" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//; /^$/d'; }
          for c in $(git rev-list "$base".."$head"); do
            an=$(git log -1 --format=%an "$c"); ae=$(git log -1 --format=%ae "$c")
            cn=$(git log -1 --format=%cn "$c"); ce=$(git log -1 --format=%ce "$c")
            short=$(git log -1 --format='%h %s' "$c")
            if is_agent "$an" "$ae" || is_agent "$cn" "$ce"; then echo "$short: authored or committed as an agent ($an <$ae>, $cn <$ce>)"; bad=1; fi
            for key in Signed-off-by Co-Authored-By; do
              trailer_values "$c" "$key" | while IFS= read -r who; do
                n=$(trim "${who%%<*}"); e=${who#*<}; e=$(trim "${e%%>*}")
                if is_agent "$n" "$e"; then echo "$short: an agent is named in a trailer: $key: $who"; exit 1; fi
              done || bad=1
            done
            sobs=$(trailer_values "$c" Signed-off-by)
            if ! printf '%s\n' "$sobs" | grep -qxF "$an <$ae>"; then echo "$short: not signed off by its author ($an <$ae>)"; bad=1; fi
            if [ "$cn <$ce>" != "$an <$ae>" ] && ! printf '%s\n' "$sobs" | grep -qxF "$cn <$ce>"; then echo "$short: not signed off by its committer ($cn <$ce>)"; bad=1; fi
            if [ -n "$(trailer_values "$c" Claude-Session)" ]; then echo "$short: carries a Claude-Session trailer"; bad=1; fi
          done
          [ "$bad" = 0 ] && echo "signoff: OK — every commit is signed off by its author and committer, none made as or naming an agent"
          exit "$bad"
