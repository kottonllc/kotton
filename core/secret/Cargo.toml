[package]
name = "kotton-secret"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[dependencies]
serde_json = "1.0"
kotton-sys = { path = "../sys" }
kotton-common = { path = "../common" }
ed25519-dalek = "2.1"
rand = "0.8"
thiserror = "2.0"
hex = "0.4"
tracing = "0.1"
# On Linux, prefer the kernel keyring (linux-keyutils) over D-Bus Secret Service
# so tests pass in CI and WSL where D-Bus is unavailable.
keyring = { version = "2.3", features = ["linux-no-secret-service"] }

[target.'cfg(unix)'.dependencies]
# The two errno values `FileSecrets` tolerates from `fsync` on a directory
# (EINVAL, ENOTSUP), named rather than spelled as numbers that differ by OS.
# Already in the tree.
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# TPM-backed device binding (RFC-0053 step 8) via CNG's Platform Crypto
# Provider. Same crate family already used by the network provider.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Secure Enclave device binding (RFC-0053 step 8). Security.framework is
# declared directly in the module; core-foundation supplies the CF types.
core-foundation = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the tree transitively via keyring's own Linux dependency (same
# version pin) — named directly so `os.rs` can downcast a `keyring::Error`'s
# platform-failure source to tell "add_key/keyctl refused" apart from every
# other kernel-keyring failure, rather than matching on display text.
#
# The version range here must stay one Cargo will unify with keyring's own
# `linux-keyutils` requirement (`keyring-2.3.3/Cargo.toml`, currently "0.2"
# too): two incompatible ranges would resolve to two distinct copies of the
# crate, and `downcast_ref::<linux_keyutils::KeyError>()` would then target a
# different type than the one `keyring` actually boxes — failing silently,
# with every refused keyring falling back to the generic message. Bumping
# `keyring` past a `linux-keyutils` major needs this bumped with it.
linux-keyutils = { version = "0.2", features = ["std"] }

[dev-dependencies]
workspace-hack = { path = "../../tools/workspace-hack" }
# The TPM tests share one persisted key, so they must not run in parallel.
serial_test = "3"
# The throwaway-root rule is pinned against a real temp directory.
tempfile = "3"

[features]
default = []
test-utils = []

[lints]
workspace = true
