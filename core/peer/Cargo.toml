[package]
name = "kotton-peer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
kotton-sys = { path = "../sys" }
kotton-common = { path = "../common" }
kotton-crypto = { path = "../crypto" }
kotton-pair = { path = "../pair" }
# Promoted from dev-dependencies when `pairing` moved in: the mesh assembly
# establishes connections, so `peer` genuinely needs the transport toolkit now.
# See IDEA-authority-is-the-axis — the dev-only edge reflected what
# `peer` happened to contain, not a decision to stay off transports.
kotton-net = { path = "../net" }
kotton-diag = { path = "../diag" }
kotton-org = { path = "../org" }
kotton-schemas = { path = "../schemas" }
curve25519-dalek = { workspace = true }
ed25519-dalek = { workspace = true }
rustls = { version = "0.23", features = ["ring"] }
hex = "0.4"
sha2 = { workspace = true }
socket2 = { version = "0.5", features = ["all"] }
x25519-dalek = { workspace = true }
chacha20poly1305 = { workspace = true }
rand = { workspace = true }
kotton-wire = { path = "../wire" }
kotton-identity = { path = "../identity" }
kotton-record = { path = "../record" }
# `membership` states what it needs somewhere to put member records; a
# `UserStore` is the thing that satisfies it. The impl lives here rather than
# in `store` so that `store` never learns what a member is.
kotton-store = { path = "../store" }
kotton-ipc = { path = "../ipc" }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
uuid = { version = "1.6", features = ["v4"] }
base64 = "0.22"
aes-kw = "0.2"
hkdf = "0.12"
# The rendezvous handle is derived from a 33-bit spoken code and the relay sees
# it, so the derivation is slow on purpose (contact_pairing).
argon2 = { workspace = true }
chrono = "0.4"

async-trait = "0.1"
tokio = { workspace = true }
quinn = "0.11"
anyhow = "1.0"
thiserror = "2.0"
serde = { workspace = true }
serde_json = "1.0"
bytes = "1.5"
tracing = "0.1"
# Whole-object content hash for chunked sealed writes (RFC-0048).
blake3 = "1"

[dev-dependencies]
workspace-hack = { path = "../../tools/workspace-hack" }
rand = "0.8"
tempfile = "3.8"
# Test-only: the membership tests exercise the impl through a real `UserStore`
# with an encrypted local mount, which needs a filesystem to build. Dev-only,
# so this crate names no host OS in production (RFC-0080 step 5).
kotton-fs = { path = "../fs" }
rcgen = "0.13"
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
