[package]
name = "kotton-diag"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[dependencies]
# Platform abstractions
kotton-sys = { path = "../sys" }

# Schemas
kotton-wire = { path = "../wire" }

# Async support
async-trait = "0.1"
tokio = { version = "1.41", features = ["sync", "time"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Time
chrono = "0.4"

# Cryptography
blake3 = "1.5"

# Random number generation
rand = "0.8"

# Logging
tracing = "0.1"

# Utilities
futures = "0.3"

[dev-dependencies]
workspace-hack = { path = "../../tools/workspace-hack" }
kotton-net = { path = "../net" }
kotton-record = { path = "../record" }
tokio = { version = "1.41", features = ["full"] }
tempfile = "3.8"

[lints]
workspace = true
