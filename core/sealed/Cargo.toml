[package]
name = "kotton-sealed"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# `kotton-sys` also carries the admitted key, `StorageKey`, every verb here
# takes: nothing in this crate rewrites a key (kotton #275, #320).
kotton-sys = { path = "../sys" }
kotton-fs = { path = "../fs" }
anyhow = "1.0"

[lints]
workspace = true

[dev-dependencies]
workspace-hack = { path = "../../tools/workspace-hack" }
async-trait = "0.1"
bytes = "1.5"
futures = "0.3"
