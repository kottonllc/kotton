[package]
name = "kotton-fs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
kotton-schemas = { path = "../schemas" }
anyhow = "1.0"
kotton-sys = { path = "../sys" }

# Async filesystem
tokio = { version = "1.41", features = ["fs", "io-util"] }
bytes = "1.5"
async-trait = "0.1"

[dev-dependencies]
workspace-hack = { path = "../../tools/workspace-hack" }
tokio = { version = "1.41", features = ["full"] }
tempfile = "3.8"

[features]
default = []
test-utils = []

[lints]
workspace = true
