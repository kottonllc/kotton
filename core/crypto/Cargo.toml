[package]
name = "kotton-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
kotton-common = { path = "../common" }
kotton-pair = { path = "../pair" }
kotton-sys = { path = "../sys" }
tracing = { workspace = true }
kotton-wire = { path = "../wire" }
kotton-schemas = { path = "../schemas" }

# Cryptography libraries
ring = "0.17"
blake3 = { workspace = true }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hkdf = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
rand_chacha = "0.3"
argon2 = "0.5"
serde = { workspace = true }
serde_json = { workspace = true }
getrandom = { workspace = true }
multibase = "0.9"
bip39 = { workspace = true }
anyhow = { workspace = true }
async-trait = "0.1"
x25519-dalek = { workspace = true }
curve25519-dalek = { workspace = true }
# Post-quantum signatures (FIPS 204 / ML-DSA).  Pre-release until 1.x is tagged.
# FROST threshold signatures (Zcash Foundation, audited).
frost-ed25519 = { workspace = true }
thiserror = { workspace = true }
zxcvbn = "3"

[dev-dependencies]
workspace-hack = { path = "../../tools/workspace-hack" }
tokio = { version = "1.41", features = ["full"] }

[features]
default = []
test-utils = []

[lints]
workspace = true
