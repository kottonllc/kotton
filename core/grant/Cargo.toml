[package]
name = "kotton-grant"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[dependencies]
kotton-common = { path = "../common" }
kotton-crypto = { path = "../crypto" }
kotton-wire = { path = "../wire" }
kotton-schemas = { path = "../schemas" }
uuid = { version = "1", features = ["v4"] }
anyhow = "1.0"
base64 = "0.22"
ed25519-dalek = { workspace = true }
serde_json = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { workspace = true }

[dev-dependencies]
workspace-hack = { path = "../../tools/workspace-hack" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
