[package]
name = "kquicd"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[dependencies]
kotton-sys = { path = "../sys" }
kotton-wire = { path = "../wire" }
kotton-ipc = { path = "../ipc" }
kotton-net = { path = "../net" }
kotton-common = { path = "../common" }

ed25519-dalek = { workspace = true }
quinn = "0.11"
rustls = { version = "0.23", features = ["ring"] }
serde_json = "1.0"
hex = "0.4"
tokio = { version = "1.41", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { workspace = true }
tracing-log = "0.2"

[lints]
workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = { workspace = true }

[dev-dependencies]
workspace-hack = { path = "../../tools/workspace-hack" }
