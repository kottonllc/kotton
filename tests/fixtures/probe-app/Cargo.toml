[package]
name    = "kotton-probe-app"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

# A guest that asks for two capabilities, so a test can approve one and prove
# the other is out of reach. It does nothing else. Built by
# `cargo xtask build-apps` into `app.wasm` beside this file, and installed by
# `confinement` in the integration suite.

[lib]
crate-type = ["cdylib"]

[dependencies]
kotton-app = { path = "../../../guest/sdk/kotton-app" }

# Own workspace root: this crate targets wasm32-wasip2 and is excluded from the
# repo workspace, like the guest apps.
[workspace]
