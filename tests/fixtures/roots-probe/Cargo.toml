[package]
name    = "kotton-roots-probe"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

# An occupant that tries every door to the person's files and says what each
# one answered.
#
# `TASK-a-member-writes-in-a-roots-tree`: an occupant the person approved only
# to *read* its files wrote them through `roots.tree` on the Personal root. The
# unit tests on each side of the process boundary show the host no longer hands
# Personal a tree and the sandbox refuses what it is handed; this runs both
# halves together — a real daemon's launch, a real confined runner, a real
# component — so the two cannot drift apart unseen.
#
# Built by `cargo xtask build-apps` into `app.wasm` beside this file, and loaded
# by `a_read_only_occupant_cannot_write_its_files_by_any_door` in the suite.

[lib]
crate-type = ["cdylib"]

[dependencies]
# `occupant`: `kotton:app/roots` is in `world occupant` and nowhere else.
kotton-app = { path = "../../../guest/sdk/kotton-app", features = ["occupant", "data"] }

# Own workspace root: this crate targets wasm32-wasip2 and is excluded from the
# repo workspace, like the guest apps.
[workspace]
