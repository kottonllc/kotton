[app]
id      = "sh.kotton.rootsprobe"
name    = "Roots probe"
version = "0.1.0"
# The occupant is long-lived; a one-shot launch refuses it.
kind    = "long-lived"

# Read, and only read, on the person's whole tree: the grant the assessor's
# probe held. Everything this fixture then manages to write, it wrote around it.
[capabilities]
"files.read" = ["/"]
