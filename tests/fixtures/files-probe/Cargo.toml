[package]
name    = "kotton-files-probe"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

# An ordinary app that writes, reads and lists files through the handle its
# `files` grant minted, and paints what each call answered.
#
# `TASK-a-file-an-app-writes-rests-in-the-clear-in-the-sealed-stores-own-directory`:
# a file a guest wrote through `files.write` rested in the sealed store's own
# directory in the clear, under its own name. This drives the whole path a
# person's editor drives — a real daemon's launch, a real confined runner, a
# real component — so the suite can show the bytes landing sealed in the store
# and nowhere else.
#
# Built by `cargo xtask build-apps` into `app.wasm` beside this file, and loaded
# by `a_file_an_app_writes_rests_sealed_and_packs_and_reads_back` in the suite.

[lib]
crate-type = ["cdylib"]

[dependencies]
# `world app`: the world every ordinary app is instantiated into.
kotton-app = { path = "../../../guest/sdk/kotton-app" }

# Own workspace root: this crate targets wasm32-wasip2 and is excluded from the
# repo workspace, like the guest apps.
[workspace]
