[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
license.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
kotton-pty-drive = { path = "../tools/pty-drive" }
# Single source of truth for the daemon socket path — avoids re-implementing (and
# drifting from) the resolver, which broke macOS onboarding (long $TMPDIR socket).
kotton-common = { path = "../core/common" }
# Where cargo put a build's output, read from `cargo metadata` and from a build's own
# JSON messages rather than composed from a layout (`src/out.rs`).
serde_json = { workspace = true }
# Colour for `doctor`'s report — the crate the shell already links for the same
# job, and nothing else: no table or layout framework, because the report is held
# to a fixed width by a test rather than laid out at runtime.
colored = "2.1"
# `actions-check` reads `.github/workflows/` with a real YAML parser, because a line scanner
# over YAML fails open: flow mappings, quoted keys and `key : value` all read as nothing.
# yaml-rust2, not serde_yaml (archived, unmaintained since 2024) or serde_yml (unsound); pure
# Rust, three small dependencies, maintained — 0.13.0 published 2026-09-11. Pinned exactly: a
# gate's parser changing under it changes what the gate admits.
yaml-rust2 = { version = "=0.13.0", default-features = false }

# `gen-docs` / `docs-check` are the only subcommands that need the real command
# tree, and depending on it unconditionally made every *other* check pay for
# kotton-runtime, ring and libsqlite3-sys: 5m53s to link a binary whose actual
# work is reading and writing Markdown in 37ms. `just lint` runs `cargo clippy`
# over the workspace anyway, so the docs checks cost nothing extra there; what
# this buys is a cheap `cargo xtask` for every other check.
kotton-cli = { path = "../client/cli", optional = true }
# clap is not used directly — it is here for the derive the `Cli` type carries.
clap = { version = "4.5", features = ["derive"], optional = true }
clap-markdown = { version = "0.1", optional = true }

[features]
cli-docs = ["dep:kotton-cli", "dep:clap", "dep:clap-markdown"]

[dev-dependencies]
workspace-hack = { path = "../tools/workspace-hack" }
tempfile = "3.8"
