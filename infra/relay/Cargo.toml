[package]
name = "kotton-relay"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Kotton LLC"]

[[bin]]
name = "kotton-relay"
path = "src/main.rs"

[dependencies]
# Kotton schemas (wire types only — no runtime dep)
kotton-wire = { path = "../../core/wire" }

# Web framework
axum = { version = "0.7", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower-http = { version = "0.6", features = ["trace"] }

# Async
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
base64 = "0.21"
bs58 = "0.5"
rand = "0.8"
sha2 = "0.10"
# The admission tag (`src/admission.rs`): HMAC-SHA256 under the relay's admission key.
hmac = "0.12"
# `O_NOFOLLOW` and its errno, by name: the one file root opens in the state
# directory (`give_back_what_root_left`, `src/admission.rs`). Constants only.
libc = "0.2"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Concurrent data structures
dashmap = "6"

# Circuit ids
uuid = { version = "1", features = ["v4"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2.0"

[dev-dependencies]
# WebSocket client for the relay circuit integration test.
tokio-tungstenite = "0.21"

[workspace]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
